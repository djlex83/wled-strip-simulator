<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LED Strip Simulator for WLED</title>
<meta name="description" content="Try WLED effects in the browser: split a strip into segments, give each an effect and copy the JSON to your WLED.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: the strip sits sticky on top; below, segment cards on the left and strip settings + JSON on the right (from 980px) */
:root{
  --bg:#0a0d13;
  --panel:#10151d;
  --raise:#171d28;
  --line:#252e3c;
  --fg:#e8ebf1;
  --muted:#8f98aa;
  --accent:#ffb547;
  --accent-ink:#1d1405;
  --night:#05070b;
  --warn:#ff8a7a;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1280px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px;margin-bottom:14px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4vw,38px);line-height:1.05;margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--accent)}
.sub{margin:4px 0 0;color:var(--muted);max-width:78ch}
.top-actions{display:flex;gap:8px;align-items:center}
a{color:var(--accent)}

[hidden]{display:none!important}
.stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-bottom:12px;transition:box-shadow .2s}
/* the soft edge only while the strip is stuck on top, so it never covers the buttons below it at rest */
.stage.stuck{box-shadow:0 10px 16px 2px var(--bg)}
.stage-box{background:var(--night);border:1px solid var(--line);border-radius:14px;max-height:44vh;overflow:auto}
.stage canvas{display:block;width:100%}
.stage-meta{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:8px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.stage-meta b{color:var(--fg);font-weight:500}

.layout{display:grid;gap:16px}
@media (min-width:980px){.layout{grid-template-columns:minmax(0,1fr) 360px;align-items:start}}
.col{display:grid;gap:16px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px 16px;display:grid;gap:12px;min-width:0}
h2{font-family:var(--f-display);font-weight:700;font-size:20px;margin:0;line-height:1.1}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field{display:grid;gap:4px;min-width:0}
.hint{margin:0;color:var(--muted);font-size:13px}

input[type=number],select,textarea{font:inherit;color:var(--fg);background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
input[type=number]{width:6.5em;font-family:var(--f-mono);font-size:13px}
select{padding-right:26px}
textarea{width:100%;min-height:110px;font-family:var(--f-mono);font-size:12px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent);min-width:0}
input[type=color]{width:40px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--raise)}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
label.check{display:inline-flex;align-items:center;gap:7px;font-size:14px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,pre:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{appearance:none;border:1px solid var(--line);background:var(--raise);color:var(--fg);font:500 13px/1 var(--f-body);padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:6px 9px;font-size:12px}
.btn.ghost{background:transparent}

.seg{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--segc,var(--accent));border-radius:12px;padding:12px 14px 14px;display:grid;gap:12px;min-width:0}
.seg.off{opacity:.62}
.seg-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.seg-title{font-family:var(--f-display);font-weight:700;font-size:18px;white-space:nowrap}
.seg-range{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.seg-head .grow{flex:1}
.seg-head select{max-width:220px}
.warn{color:var(--warn);font-size:12.5px}
.grid2{display:grid;gap:10px 16px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.slider{display:grid;grid-template-columns:minmax(0,1fr) 3.2ch;gap:2px 10px;align-items:center}
.slider .lbl{grid-column:1/-1;text-transform:none;letter-spacing:0;font-family:var(--f-body);font-size:13px;color:var(--fg)}
.slider output{font-family:var(--f-mono);font-size:12px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.colors{display:flex;flex-wrap:wrap;gap:10px 18px}
.color{display:flex;align-items:center;gap:8px;font-size:13px}
.color input[type=number]{width:4.2em}
.empty{color:var(--muted);margin:0}
pre{margin:0;padding:10px 12px;background:var(--night);border:1px solid var(--line);border-radius:8px;font-family:var(--f-mono);font-size:11.5px;line-height:1.5;color:var(--fg);overflow:auto;max-height:320px;white-space:pre}
.msg{font-size:13px;color:var(--muted);margin:0}
.msg.err{color:var(--warn)}
.foot{margin:22px 0 0;color:var(--muted);font-size:13px;max-width:95ch}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 data-i18n-html="title"></h1>
      <p class="sub" data-i18n="sub"></p>
    </div>
    <div class="top-actions">
      <a class="btn ghost" href="https://github.com/djlex83/wled-strip-simulator">GitHub</a>
      <button class="btn primary" id="share" type="button" data-i18n="share"></button>
      <button class="btn" id="lang" type="button"></button>
    </div>
  </header>

  <div class="stage">
    <div class="stage-box" id="stageBox"><canvas id="cv" role="img" aria-label="LED strip preview"></canvas></div>
    <div class="stage-meta" id="meta"></div>
  </div>

  <div class="layout">
    <div class="col">
      <div class="row" style="justify-content:space-between">
        <h2 data-i18n="segments"></h2>
        <div class="row">
          <button class="btn small" id="restart" type="button" data-i18n="restartAll"></button>
          <button class="btn small primary" id="addSeg" type="button" data-i18n="addSeg"></button>
        </div>
      </div>
      <div id="segs" class="col"></div>
    </div>

    <div class="col">
      <section class="panel" aria-labelledby="h-strip">
        <h2 id="h-strip" data-i18n="strip"></h2>
        <div class="row">
          <div class="field"><span class="lbl" data-i18n="layout"></span>
            <select id="mode"><option value="0" data-i18n="modeStrip"></option><option value="1" data-i18n="modeMatrix"></option></select></div>
          <div class="field"><span class="lbl" data-i18n="type"></span>
            <select id="rgbw"><option value="0">RGB</option><option value="1">RGBW</option></select></div>
        </div>
        <div class="row">
          <div class="field" id="f-count"><span class="lbl" data-i18n="leds"></span><input type="number" id="count" min="1" max="1500" step="1"></div>
          <div class="field" id="f-perRow"><span class="lbl" data-i18n="perRow"></span><input type="number" id="perRow" min="0" max="1500" step="1"></div>
          <div class="field" id="f-mw" hidden><span class="lbl" data-i18n="mw"></span><input type="number" id="mw" min="1" max="128" step="1"></div>
          <div class="field" id="f-mh" hidden><span class="lbl" data-i18n="mh"></span><input type="number" id="mh" min="1" max="128" step="1"></div>
        </div>
        <div class="slider"><span class="lbl" data-i18n="brightness"></span><input type="range" id="bri" min="0" max="255"><output id="briOut"></output></div>
        <label class="check"><input type="checkbox" id="gamma"> <span data-i18n="gamma"></span></label>
        <div class="row">
          <div class="field" style="flex:1"><span class="lbl" data-i18n="examples"></span><select id="examples"></select></div>
        </div>
        <div class="row" style="align-items:flex-end">
          <div class="field"><span class="lbl" data-i18n="split"></span><input type="number" id="splitN" min="1" max="32" value="3"></div>
          <button class="btn" id="splitBtn" type="button" data-i18n="splitBtn"></button>
        </div>
      </section>

      <section class="panel" aria-labelledby="h-json">
        <h2 id="h-json" data-i18n="json"></h2>
        <p class="hint" data-i18n="exportHint"></p>
        <p class="hint" id="m2dHint" data-i18n="m2dHint" hidden></p>
        <p class="warn" id="labOut" hidden></p>
        <pre id="out" tabindex="0"></pre>
        <div class="row"><button class="btn small" id="copy" type="button" data-i18n="copy"></button><p class="msg" id="copyMsg" hidden></p></div>
        <span class="lbl" data-i18n="import"></span>
        <p class="hint" data-i18n="importHint"></p>
        <textarea id="in" spellcheck="false" placeholder='{"bri":128,"seg":[{"id":0,"start":0,"stop":60,"fx":85,"col":[[255,170,0]]}]}'></textarea>
        <div class="row"><button class="btn small" id="apply" type="button" data-i18n="apply"></button></div>
        <p class="msg" id="inMsg" hidden></p>
      </section>
    </div>
  </div>

  <p class="foot" data-i18n="foot"></p>
</div>

<script>
(() => {

/* ================= texts ================= */

try { const saved = localStorage.getItem('wss-lang'); lang = saved || ((navigator.language || '').toLowerCase().startsWith('de') ? 'de' : 'en'); } catch (e) { lang = (navigator.language || '').toLowerCase().startsWith('de') ? 'de' : 'en'; }
const t = (k, v) => { let s = T[lang][k] ?? T.en[k] ?? k; if (v) for (const x in v) s = s.replace('{' + x + '}', v[x]); return s; };

/* ================= colour helpers ================= */
const BLACK = [0, 0, 0, 0];
const GL = new Float32Array(256); for (let i = 0; i < 256; i++) GL[i] = Math.pow(i / 255, 2.8) * 255;
const rnd = n => n > 0 ? Math.floor(Math.random() * n) : 0;
// color_blend(a, b, amount) with amount = round(k * 255): (c1 * (256 - b) + c2 * (b + 1)) >> 8 per channel
const mix = (a, b, k) => { const bl = Math.max(0, Math.min(255, Math.round(k * 255))), k1 = 256 - bl, k2 = bl + 1;
  return [0, 1, 2, 3].map(i => (Math.round(a[i] || 0) * k1 + Math.round(b[i] || 0) * k2) >> 8); };
const isBlack = c => !c[0] && !c[1] && !c[2] && !c[3];
const scale8 = (i, s) => (Math.floor(i) * (1 + Math.floor(s))) >> 8;
// color_fade(c, amount, true): "video" fade, channels at or above half of the brightest keep one extra step
const fadeC = (c, a) => { const r = Math.round(c[0]) | 0, g = Math.round(c[1]) | 0, b = Math.round(c[2]) | 0, w = Math.round(c[3] || 0) | 0; a = Math.round(a) & 255;
  if (!r && !g && !b && !w) return [0, 0, 0, 0]; if (a === 255) return [r, g, b, w]; if (a === 0) return [0, 0, 0, 0];
  const thr = (Math.max(r, g, b) >> 1) + 1, f = v => ((v * a) >> 8) + (v >= thr ? 1 : 0); return [f(r), f(g), f(b), f(w)]; };
const tri8 = x => x < 128 ? x << 1 : 255 - ((x - 128) << 1);
const sin8 = x => Math.round(128 + 127 * Math.sin(x / 256 * 2 * Math.PI));
const cos8 = x => Math.round(128 + 127 * Math.cos(x / 256 * 2 * Math.PI));
const tri16 = x => { x = Math.floor(x) & 0xFFFF; return x < 0x8000 ? x * 2 : 0xFFFF - (x - 0x8000) * 2; };
function hashU(i) { let x = Math.imul(i, 2654435761 | 0) >>> 0; x ^= x >>> 16; x = Math.imul(x, 0x7feb352d) >>> 0; x ^= x >>> 15; x = Math.imul(x, 0x846ca68b | 0) >>> 0; x ^= x >>> 16; return x >>> 0; }
const hashF = n => hashU(n) / 4294967296;
/* ================= palettes (as in WLED 16, palettes.cpp) ================= */
const HX = a => a.map(h => [h >> 16 & 255, h >> 8 & 255, h & 255, 0]);
const P16 = {
  6: HX([0x9B00D5,0xBD00B8,0xDA0092,0xF3005C,0xF45500,0xDC8F00,0xD5B400,0xD5D500,0xD59B00,0xEF6600,0xF90044,0xE10086,0xC400B0,0xA300CF,0x7600E8,0x0032FC]),
  7: HX([0x0000FF,0x00008B,0x00008B,0x00008B,0x00008B,0x00008B,0x00008B,0x00008B,0x0000FF,0x00008B,0x87CEEB,0x87CEEB,0xADD8E6,0xFFFFFF,0xADD8E6,0x87CEEB]),

      w.addEventListener('change', () => { s.col[ci][3] = Math.max(0, Math.min(255, Math.round(+w.value) || 0)); updateOut(); }); kids.push(el('span', { class: 'lbl', text: t('white') }), w); }
    colors.appendChild(el('div', { class: 'color' }, kids)); });

    ps.addEventListener('change', () => { s.pal = +ps.value; updateOut(); }); colors.appendChild(el('div', { class: 'color' }, [el('span', { class: 'lbl', text: t('palette') }), ps])); }

}

function renderSegs() {

function drawMeta() { $('meta').innerHTML = ''; $('meta').appendChild(el('span', { text: strip.m2d ? t('metaM', { w: strip.w, h: strip.h, c: strip.w * strip.h, s: segs.length }) : t('meta', { c: strip.count, s: segs.length, r: geo ? geo.rows : 1 }) })); }

function segJson(s) {

function updateOut() {

  const labSegs = segs.filter(x => FX[x.fx].lab).map(x => x.id); $('labOut').hidden = !labSegs.length; if (labSegs.length) $('labOut').textContent = t('labExport', { l: labSegs.join(', ') });

}

function renderStrip() {
  $('count').value = strip.count; $('rgbw').value = strip.rgbw ? '1' : '0'; $('perRow').value = strip.perRow; $('bri').value = strip.bri; $('briOut').textContent = strip.bri; $('gamma').checked = strip.gamma;
  $('mode').value = strip.m2d ? '1' : '0'; $('mw').value = strip.w; $('mh').value = strip.h;
  $('f-count').hidden = $('f-perRow').hidden = strip.m2d; $('f-mw').hidden = $('f-mh').hidden = !strip.m2d; $('m2dHint').hidden = !strip.m2d;
}
function renderAll() { renderStrip(); layout(); renderSegs(); updateOut(); drawMeta(); }

function applyTexts() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(e => { e.innerHTML = t(e.dataset.i18nHtml); });
  $('lang').textContent = t('langBtn');
  const ex = $('examples'); ex.innerHTML = ''; ex.appendChild(el('option', { value: '', text: t('ex').pick }));
  for (const k in EX) ex.appendChild(el('option', { value: k, text: t('ex')[k] }));

/* ---- import ---- */
function parseCol(c) {

  return [0, 0, 0, 0];
}
function doImport() {

    if (strip.w * strip.h > 4096) strip.h = Math.max(1, Math.floor(4096 / strip.w)); }

    else if (!FX[fx]) { unknown.push(fx); fx = 0; }

    for (const k of ['sx', 'ix', 'c1', 'c2', 'c3', 'bri', 'pal']) if (typeof x[k] === 'number') s[k] = x[k];
    for (const k of ['o1', 'o2', 'o3', 'on', 'rev']) if (typeof x[k] === 'boolean') s[k] = x[k];
    if (Array.isArray(x.col)) s.col = [0, 1, 2].map(i => x.col[i] !== undefined ? parseCol(x.col[i]) : [0, 0, 0, 0]);
    if (!PAL_IDS.includes(s.pal)) { unknownPal.push(s.pal); s.pal = 0; }
    if (is2D) { s.start = Math.min(s.start, strip.w - 1); s.stop = Math.max(s.start + 1, Math.min(s.stop, strip.w)); s.y0 = clampInt(x.startY ?? 0, 0, strip.h - 1);
      s.y1 = clampInt(x.stopY ?? strip.h, s.y0 + 1, strip.h); s.m12 = x.m12 >= 0 && x.m12 <= 3 ? x.m12 | 0 : 0; }
    else if (FX[s.fx].info.only2D) { unknown.push(s.fx + ' (2D)'); s.fx = 0; }
    return s;
  });
  renumber(); renderAll();
  msg.textContent = t('importOk', { n: segs.length }) + (unknown.length ? ' ' + t('unknownFx', { l: [...new Set(unknown)].join(', ') }) : '')
    + (unknownPal.length ? ' ' + t('unknownPal', { l: [...new Set(unknownPal)].join(', ') }) : '');
}

/* ---- wiring ---- */
$('count').addEventListener('change', () => { strip.count = Math.max(1, Math.min(1500, Math.round(+$('count').value) || 1));
  segs.forEach(s => { s.stop = Math.min(s.stop, strip.count); s.start = Math.min(s.start, s.stop - 1); }); segs = segs.filter(s => s.stop > s.start); renumber(); renderAll(); });
$('rgbw').addEventListener('change', () => { strip.rgbw = $('rgbw').value === '1'; renderAll(); });
$('mode').addEventListener('change', () => loadExample($('mode').value === '1' ? 'm_hole' : 'tour'));
const resizeMatrix = () => { let w = clampInt($('mw').value, 1, 128), h = clampInt($('mh').value, 1, 128); if (w * h > 4096) h = Math.max(1, Math.floor(4096 / w));
  Object.assign(strip, { w, h, count: w * h });
  segs.forEach(x => { x.start = Math.min(x.start, w - 1); x.stop = Math.max(x.start + 1, Math.min(x.stop, w)); x.y0 = Math.min(x.y0, h - 1); x.y1 = Math.max(x.y0 + 1, Math.min(x.y1, h)); });
  renderAll(); };
$('mw').addEventListener('change', resizeMatrix); $('mh').addEventListener('change', resizeMatrix);
$('perRow').addEventListener('change', () => { strip.perRow = Math.max(0, Math.round(+$('perRow').value) || 0); layout(); drawMeta(); saveHash(); });
$('bri').addEventListener('input', () => { strip.bri = +$('bri').value; $('briOut').textContent = strip.bri; updateOut(); });
$('gamma').addEventListener('change', () => { strip.gamma = $('gamma').checked; saveHash(); });
$('examples').addEventListener('change', () => { if ($('examples').value) loadExample($('examples').value); $('examples').value = ''; });
$('splitBtn').addEventListener('click', () => {
  const n = Math.max(1, Math.min(32, Math.round(+$('splitN').value) || 1)), keep = segs.slice(), len = strip.m2d ? strip.w : strip.count; segs = [];
  for (let i = 0; i < n; i++) { const a = Math.floor(i * len / n), b = Math.floor((i + 1) * len / n); if (b <= a) continue;
    const src = keep[i]; if (strip.m2d) { const x = src ? newSeg(a, b, src.fx) : newSeg(a, b, 183); if (src) Object.assign(x, { sx: src.sx, ix: src.ix, c1: src.c1, c2: src.c2, c3: src.c3, o1: src.o1, o2: src.o2, o3: src.o3, pal: src.pal, col: src.col.map(c => c.slice()), bri: src.bri, rev: src.rev, m12: src.m12 }); x.y0 = 0; x.y1 = strip.h; segs.push(x); continue; }
    segs.push(src ? Object.assign(newSeg(a, b, src.fx), { sx: src.sx, ix: src.ix, c1: src.c1, c2: src.c2, c3: src.c3, o1: src.o1, o2: src.o2, o3: src.o3, pal: src.pal, col: src.col.map(c => c.slice()), bri: src.bri, rev: src.rev }) : newSeg(a, b, 85, { col: [[255, 170, 0, 0]] })); }
  renumber(); renderAll(); });
$('addSeg').addEventListener('click', () => {
  if (strip.m2d) { segs.push(newSeg(0, strip.w, 183, { y0: 0, y1: strip.h })); renumber(); renderAll(); return; }
  const end = segs.reduce((m, s) => Math.max(m, s.stop), 0), a = end < strip.count ? end : Math.max(0, strip.count - Math.max(1, Math.floor(strip.count / 4)));
  segs.push(newSeg(a, strip.count, 85)); renumber(); renderAll(); });
$('restart').addEventListener('click', () => segs.forEach(restart));
$('apply').addEventListener('click', doImport);
$('copy').addEventListener('click', () => {
  const pre = $('out'), msg = $('copyMsg');
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); msg.textContent = t('selected'); msg.hidden = false; };
  try { navigator.clipboard.writeText(pre.textContent).then(() => { msg.textContent = t('copied'); msg.hidden = false; }, fallback); } catch (e) { fallback(); }
});
$('lang').addEventListener('click', () => { lang = lang === 'de' ? 'en' : 'de'; try { localStorage.setItem('wss-lang', lang); } catch (e) { /* no storage */ } applyTexts(); renderAll(); });
/* ---- share link: the whole setup in the address (#s=...) ---- */
const hex2 = v => (Math.max(0, Math.min(255, Math.round(v) || 0))).toString(16).padStart(2, '0');
const clampInt = (v, lo, hi) => { v = Math.round(+v); return Number.isFinite(v) ? Math.max(lo, Math.min(hi, v)) : lo; };
function encodeState() {
  const o = [2, strip.count, strip.rgbw ? 1 : 0, strip.bri, strip.perRow, strip.gamma ? 1 : 0,
    segs.map(x => [x.fx, x.start, x.stop, x.on ? 1 : 0, x.bri, x.sx, x.ix, x.c1, x.c2, x.c3, (x.o1 ? 1 : 0) | (x.o2 ? 2 : 0) | (x.o3 ? 4 : 0), x.pal, x.rev ? 1 : 0,
      x.col.map(c => hex2(c[0]) + hex2(c[1]) + hex2(c[2]) + hex2(c[3])), x.y0, x.y1, x.m12]), strip.m2d ? 1 : 0, strip.w, strip.h];
  return btoa(JSON.stringify(o)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function decodeState(str) {
  let o; try { o = JSON.parse(atob(str.replace(/-/g, '+').replace(/_/g, '/'))); } catch (e) { return false; }
  if (!Array.isArray(o) || (o[0] !== 1 && o[0] !== 2) || !Array.isArray(o[6])) return false;
  const m2d = o[0] === 2 && o[7] === 1, mw = clampInt(o[8], 1, 128), mh = Math.min(clampInt(o[9], 1, 128), Math.max(1, Math.floor(4096 / mw)));
  const n = m2d ? mw : clampInt(o[1], 1, 1500), list = [];
  for (const a of o[6].slice(0, 32)) {
    if (!Array.isArray(a)) continue;
    const fx = FX[a[0]] ? a[0] : 0, start = clampInt(a[1], 0, n - 1), stop = clampInt(a[2], start + 1, n), x = newSeg(start, stop, fx);
    x.on = a[3] !== 0; x.bri = clampInt(a[4], 0, 255);
    for (const [k, i] of [['sx', 5], ['ix', 6], ['c1', 7], ['c2', 8]]) x[k] = clampInt(a[i], 0, 255);
    x.c3 = clampInt(a[9], 0, 31); const ob = clampInt(a[10], 0, 7); x.o1 = !!(ob & 1); x.o2 = !!(ob & 2); x.o3 = !!(ob & 4);
    x.pal = PAL_IDS.includes(a[11]) ? a[11] : 0; x.rev = a[12] === 1;
    if (Array.isArray(a[13])) x.col = [0, 1, 2].map(i => { const h = String(a[13][i] || ''); return /^[0-9a-f]{8}$/i.test(h) ? [0, 2, 4, 6].map(j => parseInt(h.slice(j, j + 2), 16)) : [0, 0, 0, 0]; });
    if (m2d) { x.y0 = clampInt(a[14], 0, mh - 1); x.y1 = clampInt(a[15], x.y0 + 1, mh); x.m12 = clampInt(a[16], 0, 3); }
    else if (FX[x.fx].info.only2D) { x.fx = 0; applyDefaults(x); }
    list.push(x);
  }
  Object.assign(strip, { count: m2d ? mw * mh : n, rgbw: !!o[2], bri: clampInt(o[3], 0, 255), perRow: clampInt(o[4], 0, 1500), gamma: o[5] !== 0, m2d }, m2d ? { w: mw, h: mh } : {});
  segs = list; renumber(); renderAll(); return true;
}
let hashTimer = 0, lastHash = '';
function writeHash() { clearTimeout(hashTimer); const h = '#s=' + encodeState(); if (h === lastHash) return; lastHash = h; try { history.replaceState(null, '', h); } catch (e) { /* e.g. data: URL */ } }

function loadHash() { const h = location.hash; if (!h.startsWith('#s=')) return null; lastHash = h; return decodeState(h.slice(3)); }
window.addEventListener('hashchange', () => { if (location.hash !== lastHash && loadHash() === false) loadExample('tour'); });
$('share').addEventListener('click', () => {
  writeHash(); const url = location.href, btn = $('share');
  const done = () => { btn.textContent = t('linkCopied'); setTimeout(() => { btn.textContent = t('share'); }, 2000); };
  try { navigator.clipboard.writeText(url).then(done, () => window.prompt(t('linkPrompt'), url)); } catch (e) { window.prompt(t('linkPrompt'), url); }
});
const stageEl = document.querySelector('.stage');
function markStuck() { const top = parseFloat(getComputedStyle(stageEl).top) || 0; stageEl.classList.toggle('stuck', window.scrollY > 0 && stageEl.getBoundingClientRect().top <= top + 0.5); }
window.addEventListener('scroll', markStuck, { passive: true }); window.addEventListener('resize', markStuck);
let lastW = 0;
new ResizeObserver(() => { const w = box.clientWidth; if (w === lastW) return; lastW = w; layout(); drawMeta(); }).observe(box);

applyTexts();
const fromLink = loadHash();
if (!fromLink) { loadExample('tour'); if (fromLink === false) { const m = $('inMsg'); m.hidden = false; m.className = 'msg err'; m.textContent = t('linkBad'); } }
requestAnimationFrame(x => { last = x; requestAnimationFrame(tick); });
})();
